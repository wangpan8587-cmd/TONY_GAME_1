<!DOCTYPE html>
<html>
<head>
  <meta name="x-poe-datastore-behavior" content="local_only">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; frame-src 'self'; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
  <meta charset="utf-8">
  <title>春节大冒险</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    /* 移动端适配补丁（最小侵入：提供可选工具类，不改变现有页面行为） */
    :root {
      --sat: env(safe-area-inset-top);
      --sar: env(safe-area-inset-right);
      --sab: env(safe-area-inset-bottom);
      --sal: env(safe-area-inset-left);
    }

    /* 解决 iOS Safari 100vh 与地址栏/底栏动态变化导致的“底部被吃掉” */
    .h-screen-fix {
      height: 100vh;
      height: 100dvh;
    }

    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
  <script>
    // 兜底：不支持 100dvh 的浏览器用 --vh 修正真实可视高度
    (function () {
      function setVh() {
        var vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
      }
      setVh();
      window.addEventListener('resize', setVh);
    })();
  </script>
  <script src="./assets/vendor/tailwindcss.js"></script>
  <script src="./assets/vendor/react.production.min.js"></script>
  <script src="./assets/vendor/react-dom.production.min.js"></script>
  <script src="./assets/vendor/babel.min.js"></script>
  <script src="./assets/vendor/framer-motion.js"></script>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <div id="root"></div>
  <script src="./assets/data.js"></script>
  <script type="text/babel" src="./assets/app.js?v=20260215a"></script>
</body>
</html>
